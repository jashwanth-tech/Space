name: Render Chaos Video

on:
  push:
    paths:
      - 'chaos_double_pendulum.py'
      - '.github/workflows/render_chaos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Ultra Fast)
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev libpango1.0-dev ffmpeg

    - name: Install Manim
      run: pip install manim numpy scipy

    - name: Render Video
      run: manim -pqh chaos_double_pendulum.py DeterministicNotPredictable

    - name: Upload Video to Download
      uses: actions/upload-artifact@v4
      with:
        name: Chaos-Animation
        path: media/
