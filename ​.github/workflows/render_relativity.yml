name: Render Relativity Video

on:
  push:
    paths:
      - 'no_universal_now.py'
      - '.github/workflows/render_relativity.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev libpango1.0-dev ffmpeg texlive texlive-latex-extra

    - name: Install Manim
      run: pip install manim numpy

    - name: Render Video
      run: manim -pqh no_universal_now.py NoUniversalNow

    - name: Upload Video to Download
      uses: actions/upload-artifact@v4
      with:
        name: Relativity-Animation
        path: media/

